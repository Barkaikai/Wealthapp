<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>⚡ WealthForge - Elite Automation Platform</title>
    <meta name="description" content="Futuristic AI-powered platform for wealth automation, portfolio management, and elite lifestyle optimization" />
    <meta name="theme-color" content="#6C1FFF" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- FUTURISTIC FONTS - ORBITRON & RAJDHANI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* Minimal startup overlay to reduce perceived loading friction */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(108, 31, 255, 0.08), rgba(10, 0, 30, 0.92));
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Rajdhani', sans-serif;
        transition: opacity 180ms ease;
      }
      #loading-screen h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #f7f2ff;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <!-- ELITE LOADING SCREEN -->
    <div id="loading-screen">
      <h1>⚡ WEALTHFORGE</h1>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Remove loading screen once app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.remove(), 180);
          }
        }, 200);
      });
    </script>
  </body>
</html>
